{% extends "base.html" %}
{% block title %}Login | HelpHive{% endblock %}
{% block content %}
<div class="form-card">
    <h1>Welcome back</h1>
    <p class="muted">Log in to continue helping your campus.</p>

    <form method="POST">
        <label>
            Email
            <input type="email" name="email" autocomplete="email" required>
        </label>

        <label>
            Password
            <input type="password" name="password" autocomplete="current-password" required>
        </label>

        <button class="button full" type="submit">Login →</button>
    </form>

    <p class="muted">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
